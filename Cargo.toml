[package]
name = "tickcats"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
crossterm = "0.28"
ratatui = "0.28"
serde_json = "1"
shell-words = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tickcats"
path = "src/main.rs"
